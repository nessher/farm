server {
    server_name nessher.dev www.nessher.dev 185.66.68.198; # Замените на ваш домен, когда он появится

    location = /admin/login/ {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        alias /root/farm/staticfiles/;
    }

    location /media/ {
        alias /root/farm/media/;
    }

# добавили заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

# добавили лимит на страницу входа
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nessher.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nessher.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.nessher.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nessher.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name nessher.dev www.nessher.dev 185.66.68.198;
    return 404; # managed by Certbot




}
