services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  web:
    build: .
    container_name: django_web
    restart: always
    command: sh -c "sleep 12 && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/code
    expose:
      - "8000"
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
